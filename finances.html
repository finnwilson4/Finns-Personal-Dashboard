<head>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="finances.css">
  <link rel="stylesheet" href="logout.css">
  <title>Finances</title>
</head>

<button id="logout-button" class="logout-button">Log Out</button>
<h1>Finances</h1>
  <div>
    <h1 class="link-headers">
      <a href="index.html" style="color:var(--input-text)">Home Page</a>
      <u class="current-page-header">Finances</u>
      <a href="uni-page.html" style="color:var(--input-text)">Uni Grade Tracker</a>
      <a href="meal-planner.html" style="color:var(--input-text)">Meal Planner</a>
      <a href="workout-page.html" style="color:var(--input-text)">Workouts</a>
    </h1>
  </div>
    
    <div class="dashboard">

      <div class="card balance-breakdown">
        <h2><u>Balances</u></h2>
        <div id="balance-breakdown"></div>
        <div id="outgoings-bar"></div>
        <div id="expense-sliders"></div>
        <div id="day-text"></div>
      </div>

    <div class="card pay-allocation">
        <h2><u>Pay Allocation</u></h2>
        <div id="pay-allocation"></div>
      </div>
  
  <div class="card year-view">
    <h2><u>Year Forecast</u></h2>
    <canvas id="forecast-chart-year"></canvas>
    <div id="year-text"></div>
  </div>

  <div class="card month-view">
    <h2><u>Month Forecast</u></h2>
    <canvas id="forecast-chart-month"></canvas>
    <div id="month-text"></div>
  </div>

  <div class="card work-schedule">
    <h2><u>Work Schdeule</u></h2>
    <div id="work-schedule"></div>
  </div>

  <div class="card pay-display">
    <h2><u>Pay Tracker</u></h2>
    <div class="pay-tracker">
      <div id="pay-tracker"></div>
    </div>
    <div class="pay-display-chart">
        <canvas id="pay-tracker-chart"></canvas>
        <button id="pay-prediction-toggle" onclick="togglePayPrediction()">
          Prediction: Current Total
        </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="shared-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="auth.js"></script>
<script src="logout.js"></script>
<script src="finances.js"></script>
